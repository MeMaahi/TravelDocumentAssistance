<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Travel Document Assistance</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#18202a}
nav{padding:16px 7%;background:#17324d}
nav a{color:white;margin-right:18px;text-decoration:none;font-weight:600}
main{max-width:950px;margin:35px auto;padding:28px;background:white;border-radius:14px;box-shadow:0 4px 20px #00000010}
textarea,input{width:100%;padding:11px;margin:8px 0 14px;box-sizing:border-box;border:1px solid #ccd3da;border-radius:7px}
button{padding:11px 20px;cursor:pointer;border:0;border-radius:7px;background:#17324d;color:white}
pre{white-space:pre-wrap;background:#f1f3f5;padding:15px;border-radius:8px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{padding:22px;border:1px solid #dce1e6;border-radius:10px;text-decoration:none;color:#18202a;background:#fafbfc}
.card:hover{background:#eef4f8}
.small{color:#667085}
@media(max-width:700px){.grid{grid-template-columns:1fr}nav a{display:inline-block;margin-bottom:8px}}
</style>
</head>
<body>
<nav>
<a href="/">Home</a>
<a href="/text-analysis">Text Analysis</a>
<a href="/image-analysis">Document Image Analysis</a>
<a href="/vision">Vision Analysis</a>
</nav>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
