{% extends "base.html" %}
{% block content %}
<h2>Travel Vision Analysis</h2>
<p>Upload a travel-related image and ask the AI what you want to know.</p>
<input id="i" type="file" accept="image/*">
<textarea id="p" rows="4">Describe this travel-related image. Identify important objects, places, signs, and readable travel information.</textarea>
<button onclick="go()">Analyze Image</button>
<pre id="o"></pre>
<script>
async function go(){
    if(!i.files[0]){o.textContent="Please select an image.";return;}
    let f=new FormData();
    f.append('image',i.files[0]);
    f.append('prompt',p.value);
    o.textContent="Loading...";
    let r=await fetch('/api/vision',{method:'POST',body:f});
    let j=await r.json();
    o.textContent=j.result||j.error;
}
</script>
{% endblock %}
